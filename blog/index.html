<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Sushil Chhetri</title>
    <meta name="description" content="Writing by Sushil Chhetri on durable execution, agentic systems and the engineering behind Loom." />
    <meta property="og:title" content="Blog — Sushil Chhetri" />
    <meta property="og:description" content="Writing by Sushil Chhetri on durable execution, agentic systems and the engineering behind Loom." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sushil Chhetri" />
    <meta property="og:image" content="https://chhetrisushil.github.io/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Set before first paint so there is no flash of the wrong theme.
      try {
        const saved = localStorage.getItem("sc-theme");
        const dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="canonical" href="https://chhetrisushil.github.io/blog/" />
  </head>

  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-orbs"></div>
      <div class="bg-weave"></div>
    </div>

    <a class="skip" href="#main">Skip to content</a>

    <header class="hdr">
      <div class="hdr-in">
        <a class="brand" href="/">SC</a>
        <nav aria-label="Sections">
          <a href="/#loom">Loom</a>
          <a href="/#work">Work</a>
          <a class="keep" href="/blog/" aria-current="page">Blog</a>
          <a href="/#about">About</a>
          <a href="/#contact">Contact</a>
        </nav>
        <button id="theme" class="icon" type="button" aria-label="Toggle colour theme">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main" class="shell block blog">
      <p class="kicker">Blog</p>
      <h1 class="blog-title">Writing</h1>
      <p class="body">
        Notes on durable execution, agentic systems that have to survive production, and the
        engineering decisions behind <a href="/#loom">Loom</a>.
      </p>
      <div id="post-list" aria-live="polite"><p class="note">Loading posts…</p></div>
    </main>

    <footer class="ft">
      <div class="shell">
        <p>© <span id="yr">2026</span> Sushil Chhetri · Bengaluru</p>
      </div>
    </footer>

    <script>
      document.getElementById("theme").addEventListener("click", () => {
        const now = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = now;
        try { localStorage.setItem("sc-theme", now); } catch (e) {}
      });
      document.getElementById("yr").textContent = String(new Date().getFullYear());
    </script>
    <script type="module" src="/blog/blog.js"></script>
  </body>
</html>
