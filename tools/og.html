<!doctype html>
<!--
  Source for og.png — the social preview card.

  Kept as a file rather than regenerated by hand each time: the card repeats facts that also
  appear in index.html (role, years, what Loom is), and those drift the moment the only copy
  lives inside a binary. Render with:

    chrome-headless-shell --headless --disable-gpu --hide-scrollbars \
      --screenshot=og.png --window-size=1200,630 --force-device-scale-factor=2 og.html
    magick og.png -resize 1200x630 og.png     # supersampled down, so text stays crisp
-->
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #0b0d12;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #e7ecf3;
    -webkit-font-smoothing: antialiased;
  }
  /* Two off-canvas glows — amber top-left, violet top-right — the same pair the site's hero uses. */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .g1 { width: 900px; height: 620px; left: -220px; top: -300px; background: rgba(240,167,66,0.20); }
  .g2 { width: 820px; height: 560px; right: -180px; top: -280px; background: rgba(160,107,255,0.20); }

  .card { position: relative; height: 100%; padding: 76px 80px; display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .mark {
    width: 62px; height: 62px; border-radius: 15px;
    background: #12151c; border: 1px solid #232a36;
    display: grid; place-items: center;
    font-weight: 800; font-size: 25px; letter-spacing: 0.02em;
  }
  .mark .s { color: #f0a742; }
  .mark .c { color: #a06bff; }
  .name { font-size: 27px; font-weight: 700; letter-spacing: 0.16em; color: #f0a742; }
  .host { font-size: 24px; color: #6b7688; }

  .head { margin-top: auto; font-size: 78px; line-height: 1.14; font-weight: 800; letter-spacing: -0.022em; }
  .grad {
    background: linear-gradient(100deg, #e0725f 0%, #cf6da8 45%, #a06bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin-top: 34px; font-size: 30px; color: #9aa4b4; }

  .rule { margin: 42px 0 0; border-top: 1px solid #232a36; }
  .foot { margin-top: 30px; font-size: 27px; color: #c7cedb; }
  .foot b { color: #fff; font-weight: 700; }
</style>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="card">
  <div class="top">
    <div class="brand">
      <div class="mark"><span><span class="s">S</span><span class="c">C</span></span></div>
      <div class="name">SUSHIL CHHETRI</div>
    </div>
    <div class="host">chhetrisushil.github.io</div>
  </div>

  <h1 class="head">I build <span class="grad">durable systems</span><br />for agentic software.</h1>
  <p class="sub">Engineering manager at Google, Bengaluru &middot; 19 years building software</p>

  <div class="rule"></div>
  <p class="foot">Currently writing <b>Loom</b> &mdash; an execution kernel for agentic applications</p>
</div>
